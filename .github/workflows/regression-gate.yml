name: rag-regression-gate

# Runs on every PR. Prompt/config files live next to the code, so a PR that edits
# configs/prompts/*.yaml or configs/observability.yaml is evaluated exactly like a code change.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:vendor/dronedocs-rag/src
  DRONEDOCS_ROOT: ${{ github.workspace }}/vendor/dronedocs-rag
  HF_HOME: ~/.cache/huggingface

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - run: ruff check src tests scripts dashboard
      - run: ruff format --check src tests scripts dashboard
      - run: pytest -q

  replay-gate:
    name: regression gate (replay, no API key)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-v1 }
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Build index
        run: python -m dronedocs.cli ingest
      - name: Deterministic gate (real retrieval/rerank/citations, recorded answers) vs. baselines/eval_baseline.json
        run: python -m ragobs.gate --subset ci --replay
      - name: Gate summary
        if: always()
        run: cat reports/gate_summary.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker build
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ragobs:ci .

  live-gate:
    name: regression gate (live LLM + judge)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Live run on PRs from this repo and on manual dispatch; skipped cleanly when the secret is absent.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
    steps:
      - name: Check for an API key
        id: key
        run: if [ -n "$LLM_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No GROQ_API_KEY secret: live gate skipped" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - if: steps.key.outputs.ok == 'true'
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-models-v1 }
      - if: steps.key.outputs.ok == 'true'
        run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && pip install -e . --no-deps
      - if: steps.key.outputs.ok == 'true'
        name: Build index
        run: python -m dronedocs.cli ingest
      - if: steps.key.outputs.ok == 'true'
        name: Golden-set regression gate vs. baselines/eval_baseline.json
        run: python -m ragobs.gate --subset ci
      - name: Gate summary
        if: always() && steps.key.outputs.ok == 'true'
        run: cat reports/gate_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload gate report + traces
        if: always() && steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            reports/gate_*.json
            traces/*.jsonl
